[package]
name = "astra-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
astra-core = { path = "../astra-core" }
astra-runtime = { path = "../astra-runtime" }
astra-scene = { path = "../astra-scene" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31.1"
glam = "0.30"
egui_dock = { version = "0.16.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[lints]
workspace = true

[[bin]]
name = "astra-editor"
path = "src/main.rs"
